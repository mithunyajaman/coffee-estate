{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block auth_content %}
<div class="d-flex align-items-center justify-content-center min-vh-100 p-3" style="background: linear-gradient(135deg, rgba(35, 71, 53, 0.9) 0%, rgba(18, 38, 28, 0.95) 100%), url('{{ url_for('static', filename='images/estate-background.svg') }}') center/cover no-repeat;">
  <div class="card shadow-lg border-0 p-4" style="max-width: 440px; width: 100%; border-radius: 16px; background-color: #F6F3E9;">
    <div class="text-center mb-3">
      <div class="d-inline-flex p-3 rounded-circle bg-forest text-white mb-2">
        <i class="bi bi-question-circle fs-3"></i>
      </div>
      <h3 class="h4 fw-bold brand-forest">Reset Password</h3>
      <p class="text-muted small">Enter your Username or Employee ID to request a password reset.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="mb-3">
        <label for="identifier" class="form-label small fw-semibold">Username or Employee ID</label>
        <input type="text" class="form-control" id="identifier" name="identifier" required placeholder="e.g. EMP001, manager" autofocus>
      </div>
      <button type="submit" class="btn btn-forest w-100 mb-3">Submit Reset Request</button>
      <div class="text-center">
        <a href="{{ url_for('auth.login') }}" class="small brand-leaf text-decoration-none fw-medium">
          <i class="bi bi-arrow-left me-1"></i>Back to Sign In
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
