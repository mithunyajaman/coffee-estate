{% extends "base.html" %}

{% block title %}Reset Password | Coffee Estate ERP{% endblock %}

{% block auth_content %}
<div class="d-flex align-items-center justify-content-center min-vh-100 p-3" style="background: linear-gradient(135deg, rgba(8, 20, 13, 0.65) 0%, rgba(5, 15, 9, 0.78) 100%), url('{{ url_for('static', filename='images/coffee-estate-bg.jpg') }}') center/cover no-repeat fixed;">
  <div class="card shadow-lg border p-4 p-md-5" style="max-width: 460px; width: 100%; border-radius: 24px; background: rgba(12, 26, 18, 0.82); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-color: rgba(255, 255, 255, 0.18) !important; color: #ffffff;">
    <div class="text-center mb-4">
      <div class="d-inline-flex p-3 rounded-circle text-white mb-3 shadow" style="background: linear-gradient(135deg, #225139 0%, #346e50 100%); border: 2px solid rgba(252, 211, 77, 0.4);">
        <i class="bi bi-shield-lock-fill fs-2 text-warning"></i>
      </div>
      <h3 class="h4 fw-bold text-white mb-1">Reset Password</h3>
      <p class="text-white-50 small mb-0">Enter your Username or Roll No to request an instant password reset.</p>
    </div>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
      <div class="mb-4">
        <label for="identifier" class="form-label small fw-semibold text-white-50">Username or Employee Roll No *</label>
        <div class="input-group input-group-lg">
          <span class="input-group-text border-0" style="background: rgba(255,255,255,0.1); color: #fcd34d;">
            <i class="bi bi-person-badge"></i>
          </span>
          <input type="text" class="form-control border-0" id="identifier" name="identifier" required placeholder="e.g. manager, EMP001" autofocus style="background: rgba(255,255,255,0.12); color: #fff; font-size: 0.95rem;">
        </div>
      </div>
      <button type="submit" class="btn btn-gold w-100 py-2 mb-3 shadow hover-lift fw-bold">
        <i class="bi bi-send-check me-1"></i> Submit Reset Request
      </button>
      <div class="text-center">
        <a href="{{ url_for('auth.login') }}" class="small text-white-50 text-decoration-none hover-lift d-inline-flex align-items-center gap-1">
          <i class="bi bi-arrow-left"></i> Back to Estate Sign In
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
