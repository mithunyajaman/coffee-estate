<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#F6F3E9" rx="12"/>
  
  <!-- Outer Estate Perimeter -->
  <path d="M 60 70 L 420 50 L 740 90 L 720 430 L 360 450 L 80 410 Z" fill="#E2EDE4" stroke="#5F8663" stroke-width="3" stroke-dasharray="6,4"/>
  
  <!-- Natural Stream / Waterline -->
  <path d="M 90 80 Q 250 200, 390 240 T 730 400" fill="none" stroke="#7DD3FC" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Block A: Arabica Ridge (Slope) -->
  <path d="M 90 90 L 360 80 L 330 220 L 100 200 Z" fill="#234735" opacity="0.85"/>
  <text x="210" y="145" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BLOCK A: ARABICA NORTH</text>
  <text x="210" y="165" fill="#A3C2A8" font-family="sans-serif" font-size="11" text-anchor="middle">12.5 Hectares • Chandragiri</text>

  <!-- Block B: Robusta Valley -->
  <path d="M 380 75 L 710 100 L 680 240 L 350 230 Z" fill="#2D5A40" opacity="0.85"/>
  <text x="520" y="145" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BLOCK B: ROBUSTA CENTRAL</text>
  <text x="520" y="165" fill="#A3C2A8" font-family="sans-serif" font-size="11" text-anchor="middle">18.0 Hectares • CxR Selection</text>

  <!-- Block C: Organic Shade Micro-lot -->
  <path d="M 110 240 L 340 250 L 320 410 L 95 390 Z" fill="#5F8663" opacity="0.85"/>
  <text x="210" y="325" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">BLOCK C: SHADE NURSERY</text>
  <text x="210" y="345" fill="#E2EDE4" font-family="sans-serif" font-size="11" text-anchor="middle">6.2 Hectares • S.795 Special</text>

  <!-- Block D: Processing Yard & Drying Patio -->
  <path d="M 360 260 L 690 270 L 670 420 L 345 425 Z" fill="#7A4D2B" opacity="0.85"/>
  <text x="510" y="335" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">DRYING PATIO &amp; PULPER</text>
  <text x="510" y="355" fill="#EAD9CD" font-family="sans-serif" font-size="11" text-anchor="middle">Central Processing Hub</text>

  <!-- Compass Rose -->
  <g transform="translate(730, 60)">
    <circle cx="0" cy="0" r="22" fill="#FFFFFF" stroke="#7A4D2B" stroke-width="2"/>
    <polygon points="0,-18 5,0 0,6 -5,0" fill="#DC2626"/>
    <polygon points="0,18 5,0 0,-6 -5,0" fill="#64748B"/>
    <text x="0" y="-8" font-family="sans-serif" font-size="10" font-weight="bold" fill="#DC2626" text-anchor="middle">N</text>
  </g>
</svg>
