<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <!-- Gradients for Coffee Varieties -->
    <linearGradient id="arabicaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="robustaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <linearGradient id="kaveriGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <linearGradient id="arabicaTerraceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="50%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbfbf7"/>
      <stop offset="100%" stop-color="#f1f5f0"/>
    </linearGradient>

    <!-- Filters for Card Shadows -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- Subtle Planting Rows Pattern -->
    <pattern id="cropRows" width="16" height="16" patternUnits="userSpaceOnUse">
      <line x1="0" y1="8" x2="16" y2="8" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="960" height="560" fill="url(#bgCanvas)" rx="16" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Topographic Elevation Contours (Subtle Background) -->
  <g opacity="0.4" stroke="#94a3b8" stroke-width="1" fill="none" stroke-dasharray="3,3">
    <path d="M 40 180 Q 250 140, 500 170 T 920 150"/>
    <path d="M 40 270 Q 280 230, 520 260 T 920 250"/>
    <path d="M 40 370 Q 300 330, 550 360 T 920 350"/>
    <text x="50" y="172" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">1,250m ASL</text>
    <text x="50" y="262" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">1,150m ASL</text>
    <text x="50" y="362" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">1,000m ASL</text>
  </g>

  <!-- Estate Boundary (Outer Perimeter Fence) -->
  <rect x="35" y="35" width="890" height="445" rx="14" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8,5" opacity="0.65"/>
  <rect x="33" y="33" width="894" height="449" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.5"/>

  <!-- Freshwater Mountain Stream (Bhadra Catchment) -->
  <path d="M 450 35 Q 460 160, 440 250 T 470 480" fill="none" stroke="#bae6fd" stroke-width="16" stroke-linecap="round" opacity="0.75"/>
  <path d="M 450 35 Q 460 160, 440 250 T 470 480" fill="none" stroke="url(#waterGrad)" stroke-width="7" stroke-linecap="round"/>
  <text x="445" y="390" fill="#0369a1" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" transform="rotate(85 445 390)" letter-spacing="1.5">~ FRESHWATER SPRING STREAM ~</text>

  <!-- Internal Estate Road / Access Track -->
  <path d="M 925 260 L 760 260 Q 640 260, 600 280 T 450 260 L 35 260" fill="none" stroke="#ffffff" stroke-width="12" opacity="0.9" stroke-linecap="round"/>
  <path d="M 925 260 L 760 260 Q 640 260, 600 280 T 450 260 L 35 260" fill="none" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <path d="M 925 260 L 760 260 Q 640 260, 600 280 T 450 260 L 35 260" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,6"/>

  <!-- ==================== BLOCK A: ARABICA COFFEE ==================== -->
  <g id="blockA" filter="url(#cardShadow)">
    <rect x="55" y="55" width="365" height="190" rx="12" fill="url(#arabicaGrad)" stroke="#d97706" stroke-width="2"/>
    <rect x="55" y="55" width="365" height="190" rx="12" fill="url(#cropRows)"/>

    <!-- Left accent bar -->
    <rect x="55" y="55" width="8" height="190" rx="4" fill="#f59e0b"/>

    <!-- Header Block Identifier Badge -->
    <g transform="translate(75, 70)" filter="url(#pillShadow)">
      <rect width="88" height="26" rx="6" fill="#1f2937"/>
      <text x="44" y="17" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">BLOCK A</text>
    </g>

    <!-- Status Pill -->
    <g transform="translate(325, 70)">
      <rect width="80" height="24" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <circle cx="12" cy="12" r="4" fill="#16a34a"/>
      <text x="46" y="16" fill="#14532d" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Active</text>
    </g>

    <!-- Variety Title & Icon -->
    <text x="75" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" letter-spacing="0.5">☕ ARABICA COFFEE</text>
    <text x="75" y="145" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Cultivar: Chandragiri Selection (SLN.9)</text>

    <!-- Sub-info box -->
    <rect x="75" y="160" width="330" height="44" rx="6" fill="#000000" fill-opacity="0.25"/>
    <text x="90" y="180" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">AREA: 12.50 Hectares</text>
    <text x="235" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Elevation: 1,220m ASL</text>
    <text x="90" y="196" fill="#fef9c3" font-family="system-ui, sans-serif" font-size="10.5" opacity="0.9">Shade: Silver Oak &amp; Fig • Mild &amp; Aromatic Profile</text>
    
    <text x="75" y="230" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="11">North Ridge Aspect • Planted 2018 (6 yrs)</text>
  </g>

  <!-- ==================== BLOCK B: ROBUSTA COFFEE ==================== -->
  <g id="blockB" filter="url(#cardShadow)">
    <rect x="500" y="55" width="405" height="190" rx="12" fill="url(#robustaGrad)" stroke="#ca8a04" stroke-width="2"/>
    <rect x="500" y="55" width="405" height="190" rx="12" fill="url(#cropRows)"/>

    <!-- Left accent bar -->
    <rect x="500" y="55" width="8" height="190" rx="4" fill="#eab308"/>

    <!-- Header Block Identifier Badge -->
    <g transform="translate(520, 70)" filter="url(#pillShadow)">
      <rect width="88" height="26" rx="6" fill="#1f2937"/>
      <text x="44" y="17" fill="#fef08a" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">BLOCK B</text>
    </g>

    <!-- Status Pill -->
    <g transform="translate(810, 70)">
      <rect width="80" height="24" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <circle cx="12" cy="12" r="4" fill="#16a34a"/>
      <text x="46" y="16" fill="#14532d" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Active</text>
    </g>

    <!-- Variety Title & Icon -->
    <text x="520" y="125" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" letter-spacing="0.5">☕ ROBUSTA COFFEE</text>
    <text x="520" y="145" fill="#fef08a" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Cultivar: CxR (Congensis × Robusta Peradenia)</text>

    <!-- Sub-info box -->
    <rect x="520" y="160" width="370" height="44" rx="6" fill="#000000" fill-opacity="0.25"/>
    <text x="535" y="180" fill="#fef08a" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">AREA: 18.00 Hectares</text>
    <text x="690" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Elevation: 980m ASL</text>
    <text x="535" y="196" fill="#fefce8" font-family="system-ui, sans-serif" font-size="10.5" opacity="0.9">Valley Holding • Bold Cup, Thick Crema &amp; High Caffeine</text>

    <text x="520" y="230" fill="#fef08a" font-family="system-ui, sans-serif" font-size="11">Central East Valley • Planted 2015 (9 yrs)</text>
  </g>

  <!-- ==================== BLOCK C: KAVERI COFFEE ==================== -->
  <g id="blockC" filter="url(#cardShadow)">
    <rect x="55" y="280" width="365" height="185" rx="12" fill="url(#kaveriGrad)" stroke="#22c55e" stroke-width="2"/>
    <rect x="55" y="280" width="365" height="185" rx="12" fill="url(#cropRows)"/>

    <!-- Left accent bar -->
    <rect x="55" y="280" width="8" height="185" rx="4" fill="#4ade80"/>

    <!-- Header Block Identifier Badge -->
    <g transform="translate(75, 295)" filter="url(#pillShadow)">
      <rect width="88" height="26" rx="6" fill="#1f2937"/>
      <text x="44" y="17" fill="#86efac" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">BLOCK C</text>
    </g>

    <!-- Status Pill -->
    <g transform="translate(325, 295)">
      <rect width="80" height="24" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <circle cx="12" cy="12" r="4" fill="#16a34a"/>
      <text x="46" y="16" fill="#14532d" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Active</text>
    </g>

    <!-- Variety Title & Icon -->
    <text x="75" y="348" fill="#ffffff" font-family="system-ui, sans-serif" font-size="17" font-weight="bold" letter-spacing="0.5">☕ KAVERI COFFEE</text>
    <text x="75" y="368" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Cultivar: Cauvery (Catimor Sln.7 / Caturra × HDT)</text>

    <!-- Sub-info box -->
    <rect x="75" y="380" width="330" height="44" rx="6" fill="#000000" fill-opacity="0.25"/>
    <text x="90" y="400" fill="#86efac" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">AREA: 6.20 Hectares</text>
    <text x="235" y="400" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12">Elevation: 1,050m ASL</text>
    <text x="90" y="416" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="10.5" opacity="0.9">High Rust Resistance • Semi-Dwarf • High Yield Density</text>

    <text x="75" y="450" fill="#dcfce7" font-family="system-ui, sans-serif" font-size="11">Central Slope Parcel • Planted 2020 (4 yrs)</text>
  </g>

  <!-- ==================== BLOCK D: ARABICA TERRACES ==================== -->
  <g id="blockD" filter="url(#cardShadow)">
    <rect x="500" y="280" width="245" height="185" rx="12" fill="url(#arabicaTerraceGrad)" stroke="#f97316" stroke-width="2"/>
    <rect x="500" y="280" width="245" height="185" rx="12" fill="url(#cropRows)"/>

    <!-- Left accent bar -->
    <rect x="500" y="280" width="8" height="185" rx="4" fill="#fb923c"/>

    <!-- Header Block Identifier Badge -->
    <g transform="translate(518, 295)" filter="url(#pillShadow)">
      <rect width="88" height="26" rx="6" fill="#1f2937"/>
      <text x="44" y="17" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">BLOCK D</text>
    </g>

    <!-- Variety Title & Icon -->
    <text x="518" y="348" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">☕ ARABICA COFFEE</text>
    <text x="518" y="368" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Cultivar: Arabica Terraces (S.795)</text>

    <!-- Sub-info box -->
    <rect x="518" y="380" width="215" height="44" rx="6" fill="#000000" fill-opacity="0.25"/>
    <text x="528" y="400" fill="#fdba74" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">AREA: 9.80 Hectares</text>
    <text x="528" y="416" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10.5">South Terraces • 1,180m ASL</text>

    <text x="518" y="450" fill="#fed7aa" font-family="system-ui, sans-serif" font-size="11">Contour Planting • Planted 2017 (7 yrs)</text>
  </g>

  <!-- ==================== CENTRAL PROCESSING HUB & DRYING PATIOS ==================== -->
  <g id="processingHub" filter="url(#cardShadow)">
    <rect x="760" y="280" width="145" height="185" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="768" y="288" width="129" height="30" rx="6" fill="#f1f5f9"/>
    <text x="832" y="308" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">ESTATE HUB</text>

    <!-- Infrastructure Elements -->
    <g transform="translate(775, 330)">
      <rect width="115" height="42" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="57" y="18" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">☕ Central Pulper</text>
      <text x="57" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Eco-friendly Wet Mill</text>
    </g>

    <g transform="translate(775, 380)">
      <rect width="115" height="42" rx="4" fill="#fffbeb" stroke="#fde68a"/>
      <text x="57" y="18" fill="#92400e" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">☀️ Drying Patios</text>
      <text x="57" y="32" fill="#b45309" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Raised African Beds</text>
    </g>

    <text x="832" y="450" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Quality Testing Lab</text>
  </g>

  <!-- ==================== PROFESSIONAL NAVIGATIONAL COMPASS ==================== -->
  <g transform="translate(450, 60)" filter="url(#pillShadow)">
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    <!-- North Arrow -->
    <polygon points="0,-16 4,0 0,3 -4,0" fill="#dc2626"/>
    <!-- South Arrow -->
    <polygon points="0,16 4,0 0,-3 -4,0" fill="#64748b"/>
    <text x="0" y="-6" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#dc2626" text-anchor="middle">N</text>
  </g>

  <!-- ==================== ESTATE MAP FOOTER & LEGEND ==================== -->
  <g transform="translate(35, 490)">
    <!-- Legend Container -->
    <rect width="890" height="52" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#pillShadow)"/>

    <!-- Legend Title -->
    <text x="20" y="31" fill="#1e293b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">ESTATE LEGEND:</text>

    <!-- Item 1: Arabica Coffee -->
    <g transform="translate(130, 18)">
      <rect width="18" height="18" rx="4" fill="#78350f" stroke="#d97706"/>
      <text x="26" y="14" fill="#334155" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Block A &amp; D: Arabica (22.3 ha)</text>
    </g>

    <!-- Item 2: Robusta Coffee -->
    <g transform="translate(340, 18)">
      <rect width="18" height="18" rx="4" fill="#854d0e" stroke="#ca8a04"/>
      <text x="26" y="14" fill="#334155" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Block B: Robusta (18.0 ha)</text>
    </g>

    <!-- Item 3: Kaveri Coffee -->
    <g transform="translate(540, 18)">
      <rect width="18" height="18" rx="4" fill="#15803d" stroke="#22c55e"/>
      <text x="26" y="14" fill="#334155" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Block C: Kaveri (6.2 ha)</text>
    </g>

    <!-- Item 4: Total Planted -->
    <g transform="translate(735, 18)">
      <rect width="18" height="18" rx="4" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="26" y="14" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Total: 46.50 Hectares</text>
    </g>
  </g>
</svg>