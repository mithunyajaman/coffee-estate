<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="scanGlow" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#5F8663" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#5F8663" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#5F8663" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  
  <!-- Subtle circular reticle -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#234735" stroke-width="2" stroke-dasharray="8,6" opacity="0.35"/>
  
  <!-- Head Silhouette Guide -->
  <path d="M 150 140 C 150 100, 250 100, 250 140 C 250 190, 230 220, 200 230 C 170 220, 150 190, 150 140 Z" fill="none" stroke="#5F8663" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Shoulders Guide -->
  <path d="M 120 280 C 140 245, 170 240, 200 240 C 230 240, 260 245, 280 280" fill="none" stroke="#5F8663" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Corner Target Frame Markers -->
  <!-- Top Left -->
  <path d="M 60 100 L 60 60 L 100 60" fill="none" stroke="#234735" stroke-width="4" stroke-linecap="round"/>
  <!-- Top Right -->
  <path d="M 300 60 L 340 60 L 340 100" fill="none" stroke="#234735" stroke-width="4" stroke-linecap="round"/>
  <!-- Bottom Left -->
  <path d="M 60 300 L 60 340 L 100 340" fill="none" stroke="#234735" stroke-width="4" stroke-linecap="round"/>
  <!-- Bottom Right -->
  <path d="M 300 340 L 340 340 L 340 300" fill="none" stroke="#234735" stroke-width="4" stroke-linecap="round"/>

  <!-- Center Crosshairs -->
  <line x1="190" y1="200" x2="210" y2="200" stroke="#7A4D2B" stroke-width="2" stroke-linecap="round"/>
  <line x1="200" y1="190" x2="200" y2="210" stroke="#7A4D2B" stroke-width="2" stroke-linecap="round"/>
</svg>
